<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | LicitaciónYa</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
      background: var(--bg-surface);
    }
    .error-card {
      background: #ffffff;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 500px;
      box-shadow: var(--shadow-md);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--brand-blue);
      line-height: 1;
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--brand-navy);
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-desc">El enlace que ha seguido no existe o ha sido movido. Regrese al portal principal para explorar las licitaciones activas.</p>
      <a href="index.html" class="btn btn-lg btn-primary">Volver al Inicio</a>
    </div>
  </div>
</body>
</html>
